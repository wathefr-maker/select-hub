<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hub Select</title>
<meta name="theme-color" content="#0F0F0E">
<meta name="description" content="Hub réseaux sociaux de Select by Thibaud, Vichy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Hub Select">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky band (wordmark + tabs), then a working desk — main column (calendar, recap) + side rail (today, approvals, ideas). */
:root{
  --bg:#0F0F0E; --surface:#171715; --raised:#1E1D1A; --sunk:#141412; --ink:#F1EEE7; --muted:#A39E93; --line:#2C2B27;
  --accent:#E46A33; --accent-ink:#140B06;
  --ig:#E163A6; --fb:#5B9BF3; --tt:#2FC5CB; --pin:#F2505F;
  --s-idee:#9A958A; --s-brouillon:#C9B391; --s-valider:#F0B455; --s-valide:#72CF95; --s-programme:#9AB1F2; --s-publie:#D8D3C9;
  --warn-bg:#33260F; --ok-bg:#16291D;
  --display:'Archivo','Arial Narrow',Arial,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:12px; color-scheme:dark;
}

*{box-sizing:border-box}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* shell: side menu (computer) + bottom bar (phone) */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.shell{display:flex;min-height:100vh}
.side{position:sticky;top:0;height:100vh;width:240px;flex:none;background:var(--sunk);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;box-sizing:border-box;overflow-y:auto}
.mark{padding:0 10px 22px}
.mark b{display:block;font-family:var(--display);font-variation-settings:'wdth' 125;font-weight:800;font-size:20px;letter-spacing:.16em}
.mark span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;color:#C9C4B9;font-weight:500;text-decoration:none;font-size:14px}
.nav:hover{background:var(--raised);color:var(--ink)}
.nav[aria-current="page"]{background:#24221F;color:var(--ink)}
.nav svg,.tab svg{flex:none}
.nav .n,.tab .n{margin-left:auto;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:0 7px;line-height:18px}
.side .sp{flex:1}
.side .out{background:none;border:1px solid var(--line);color:var(--muted);border-radius:40px;padding:8px 12px;font-size:12px;cursor:pointer;margin-top:6px}
.side .out:hover{color:var(--ink);border-color:var(--muted)}
.tabbar{display:none}
main{flex:1;min-width:0}
@media (max-width:860px){
  .side{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--sunk);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
  .tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;font-size:10.5px;color:var(--muted);text-decoration:none}
  .tab[aria-current="page"]{color:var(--ink)}
  .tab .n{position:absolute;top:2px;left:calc(50% + 6px);margin:0;font-size:10px;line-height:16px;padding:0 5px}
  main{padding-bottom:84px}
}
.nfil{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.nfil button{display:inline-flex;align-items:center;gap:7px;border:1px solid #3A3934;border-radius:40px;padding:7px 14px;background:transparent;color:#C9C4B9;cursor:pointer;font-size:13px}
.nfil button[aria-pressed="true"]{background:var(--ink);color:var(--sunk);border-color:var(--ink);font-weight:600}
main.wrap{padding-block:28px 64px;max-width:1360px;margin:0;padding-left:max(20px,2.5vw);padding-right:max(20px,2.5vw)}
.banner{background:var(--warn-bg);border-radius:var(--r);padding:10px 14px;margin-bottom:20px;font-size:13px}

/* headings */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead h1{font-size:clamp(28px,4vw,40px);font-variation-settings:'wdth' 112;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.pagehead p{margin:6px 0 0;color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-size:15px;font-variation-settings:'wdth' 105;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sechead small{color:var(--muted);font-size:12px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:40px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger{color:var(--pin);border-color:currentColor;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.linkish{background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer}

/* layout */
.desk{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.stack{display:grid;gap:20px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:980px){.desk,.grid2{grid-template-columns:minmax(0,1fr)}}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:20px}
.kpi{padding:16px 18px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .v{font-family:var(--display);font-variation-settings:'wdth' 100;font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.kpi .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi .d.up{color:var(--s-valide)} .kpi .d.down{color:var(--pin)}
.kpi .split{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}

/* network marks */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.dot.ig{background:var(--ig)} .dot.fb{background:var(--fb)} .dot.tt{background:var(--tt)} .dot.pin{background:var(--pin)}
.nets{display:inline-flex;gap:3px;align-items:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.pill.idee{color:var(--s-idee)} .pill.brouillon{color:var(--s-brouillon)} .pill.a_valider{color:var(--s-valider)}
.pill.valide{color:var(--s-valide)} .pill.programme{color:var(--s-programme)} .pill.publie{color:var(--s-publie)}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--sunk);color:var(--muted);white-space:nowrap}

/* calendar */
.calnav{display:flex;align-items:center;gap:6px}
.calnav b{font-family:var(--display);font-weight:700;min-width:140px;text-align:center;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .h{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunk)}
.day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.day.out{background:var(--sunk)} .day.out .num{opacity:.4}
.day .num{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.day.today .num b{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:0 6px}
.day .add{opacity:0;border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 2px}
.day:hover .add,.day .add:focus-visible{opacity:1}
.chip{display:flex;align-items:center;gap:5px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:3px 5px;font-size:11.5px;cursor:pointer;text-align:left;min-width:0}
.chip:hover{border-color:var(--ink)}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.chip .hr{color:var(--muted);font-variant-numeric:tabular-nums}
.chip.st-publie{opacity:.6} .chip.st-a_valider{border-color:var(--s-valider)}
.agenda{display:none}
@media (max-width:640px){.cal{display:none}.agenda{display:grid;gap:14px}}
.agenda h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:6px}
.agenda .chip{font-size:13px;padding:7px 9px}

/* lists */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.row .ttl{font-weight:600;overflow-wrap:anywhere}
.row .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row.late{background:var(--warn-bg)}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.count{font-variant-numeric:tabular-nums}

/* pipeline board */
.board{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;min-height:120px}
.col>header{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px}
.pcard{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 9px;text-align:left;cursor:pointer;display:grid;gap:5px;width:100%}
.pcard:hover{border-color:var(--ink)}
.pcard .t{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.pcard .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* forms */
label.f{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
input[type=text],input[type=url],input:not([type]),input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 10px;font-size:14px;font-weight:400;color:var(--ink)}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.inline{display:flex;gap:8px;align-items:stretch}
.inline input{flex:1;min-width:0}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:40px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink)}
.check input{margin:0;accent-color:var(--accent)}
.check:has(input:checked){border-color:var(--ink);background:var(--sunk)}
.hint{font-size:12px;color:var(--muted);font-weight:400}

/* ideas */
.idea{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.idea:first-of-type{border-top:0}
.idea p{margin:0;overflow-wrap:anywhere}
.idea .acts{display:flex;gap:4px}

/* messages */
.msg{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.msg.done{opacity:.6}
.msg .q{margin:0;overflow-wrap:anywhere}
.msg .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.msg textarea{min-height:64px;font-size:13px}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap}

/* stats table */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:6px;height:70px;margin:6px 0 14px}
.bars i{flex:1;background:var(--line);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars i.cur{background:var(--accent)}
.bars i span{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-style:normal;font-size:10px;color:var(--muted)}

/* recap */
.recap h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.recap h3:first-child{margin-top:0}
.recap ul{margin:0;padding-left:18px;display:grid;gap:4px}
.recap li{max-width:68ch}

/* reperes */
.reperes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:0;padding:0;list-style:none}
.reperes li{border-top:2px solid var(--ink);padding-top:8px}
.reperes b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.reperes span{color:var(--muted);font-size:13px}

/* net header */
.nethead h1{display:flex;align-items:center;gap:12px}
.nethead h1 .dot{width:14px;height:14px}

/* editor overlay */
#overlay{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(640px,100%);height:100%;overflow-y:auto;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 22px;padding-top:calc(22px + env(safe-area-inset-top,0px));display:grid;gap:18px;align-content:start;box-shadow:-10px 0 40px rgb(0 0 0 / .2)}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet section{display:grid;gap:10px}
.sheet h2{font-size:13px}
.cap{display:grid;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--surface)}
.cap header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:13px}
.cap header span{display:inline-flex;align-items:center;gap:7px}
.cap textarea{min-height:130px;font-size:13.5px}
.cap .f{margin-bottom:8px}
.cap .foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.valbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.valbox.ok{background:var(--ok-bg)}
.who-list{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.who-list img{width:20px;height:20px;border-radius:50%}
.statgrid{display:grid;gap:8px}
.statgrid .r{display:grid;grid-template-columns:110px repeat(5,minmax(0,1fr));gap:6px;align-items:center;font-size:12px}
.statgrid .r b{display:flex;align-items:center;gap:6px}
.statgrid input{padding:6px;font-size:13px}
@media (max-width:520px){.statgrid .r{grid-template-columns:repeat(3,minmax(0,1fr))}.statgrid .r b{grid-column:1/-1}}
.footbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;bottom:calc(-28px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:12px;border-top:1px solid var(--line)}

.vis-strip{display:flex;gap:8px;flex-wrap:wrap}
.vthumb{position:relative;width:78px;height:78px;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb .vb{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;background:rgb(0 0 0 / .55)}
.vthumb .vb button{background:none;border:0;color:#fff;cursor:pointer;font-size:13px;padding:2px 6px}
.vthumb .ix{position:absolute;top:3px;left:3px;font-size:10px;background:rgb(0 0 0 / .6);color:#fff;border-radius:10px;padding:0 5px}
.upl{position:relative;display:inline-flex;align-items:center;justify-content:center;width:78px;height:78px;border:1px dashed var(--muted);border-radius:4px;cursor:pointer;color:var(--muted);font-size:12px;text-align:center;line-height:1.2}
.upl:hover,.upl:focus-within{border-color:var(--accent);color:var(--ink)}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.fmt{display:grid;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--surface)}
.fmt header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600}
.fmt header span{display:inline-flex;align-items:center;gap:7px}
.prev{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pv{position:relative;flex:none;height:128px;overflow:hidden;border-radius:3px;background:#111}
.pv .bg{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;filter:blur(12px) brightness(.8)}
.pv .fg{position:relative;width:100%;height:100%;display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:40px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cap select{width:auto;padding:4px 8px;font-size:12px}
.cap header .r{display:inline-flex;gap:6px;align-items:center}
.warn{font-size:12px;color:var(--s-valider)}
.login{max-width:420px;margin:8vh auto 0;display:grid;gap:14px}
.login h1{font-size:34px;font-variation-settings:'wdth' 112;font-weight:800;text-transform:uppercase}
.login form{display:grid;gap:10px}
.tabs .out{background:none;border:1px solid rgb(255 255 255 / .25);color:inherit;border-radius:40px;padding:7px 12px;font-size:12px;cursor:pointer;opacity:.8;white-space:nowrap}
:root[data-theme="dark"] .tabs .out{border-color:rgb(0 0 0 / .25)}
.member{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.member:first-of-type{border-top:0}
#install{display:none}
.pubst{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;padding-top:6px;border-top:1px dashed var(--line)}
.pubst.ok{color:var(--s-valide)} .pubst.err{color:var(--pin)} .pubst.wait{color:var(--s-programme)}
.pubst a{color:inherit}
.conn{display:grid;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.conn:first-of-type{border-top:0}

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return y+'-W'+pad(w)}
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function weekOffset(n){const m=monday(new Date());m.setDate(m.getDate()+7*n);return m}
function weekLabel(m){const e=new Date(m);e.setDate(e.getDate()+6);const f=(d,o)=>d.toLocaleDateString('fr-FR',o);return 'Semaine '+Number(isoWeek(m).slice(6))+' · '+f(m,{day:'numeric',month:m.getMonth()===e.getMonth()?undefined:'short'})+' – '+f(e,{day:'numeric',month:'long'})}
const fmtDay=s=>s?parse(s).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}):'Sans date';
const nf=n=>n==null||n===''?'—':Number(n).toLocaleString('fr-FR');

let pending=false;
function render(force){
  const a=document.activeElement, app=$('#app');
  if(!force&&a&&app.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){pending=true;return}
  pending=false;
  const keep={};app.querySelectorAll('[data-keep]').forEach(e=>{if(e.value)keep[e.id]=e.value});
  const authed=!['login','denied','recovery','loading'].includes(S.status);
  $('#side').hidden=!authed;$('#tabbar').hidden=!authed;
  if(!authed){app.innerHTML=authView();return}
  renderTabs();
  app.innerHTML=(S.status==='offline'?'<div class="banner">Connexion à la base impossible pour l’instant. Vérifiez internet puis rechargez la page.</div>':'')
    +({aujourdhui:viewToday,planning:viewPlanning,messages:viewMessages,stats:viewStats,studio:viewStudio,media:viewMedia,reglages:viewSettings}[route]||viewToday)();
  for(const id in keep){const e=document.getElementById(id);if(e&&!e.value)e.value=keep[id]}
  fillNames();
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pending&&!$('#app').contains(document.activeElement))render()},0));

/* KPIs */
function kpiWeek(){const cur=isoWeek(new Date()),prev=isoWeek(weekOffset(-1));if(S.kpis[cur])return{w:cur,p:isoWeek(weekOffset(-1)),cur:true};if(S.kpis[prev])return{w:prev,p:isoWeek(weekOffset(-2)),cur:false};return{w:cur,p:prev,cur:true}}
function kval(w,k,f){const v=S.kpis[w]?.[k]?.[f];return v==null||v===''?null:Number(v)}
function delta(a,b,suffix=''){if(a==null||b==null)return'';const d=a-b;return `<span class="d ${d>0?'up':d<0?'down':''}">${d>0?'+':''}${nf(d)}${suffix} vs sem. préc.</span>`}
function kpiStrip(nets){
  const {w,p,cur}=kpiWeek();
  const sum=(wk,f)=>{const v=nets.map(k=>kval(wk,k,f)).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0):null};
  const F=[['abonnes','Abonnés'],['vues','Vues'],['interactions','Interactions'],['messages','Messages reçus']];
  const both=f=>nets.filter(k=>kval(w,k,f)!=null&&kval(p,k,f)!=null);
  const subs=(wk,k)=>{const v=kval(wk,k,'abonnes');return v!=null?v:kval(p,k,'abonnes')};
  return `<div class="kpis" aria-label="Chiffres ${cur?'de la semaine':'de la semaine dernière'}">`+F.map(([f,l])=>{
    let a=sum(w,f),b;
    if(f==='abonnes'){const v=nets.map(k=>subs(w,k)).filter(x=>x!=null);a=v.length?v.reduce((x,y)=>x+y,0):null;const bn=nets.filter(k=>subs(w,k)!=null&&kval(p,k,f)!=null);b=bn.length?bn.reduce((x,k)=>x+kval(p,k,f),0):null;if(b!=null){const an=bn.reduce((x,k)=>x+subs(w,k),0);a=a;b=a-(an-b)}}
    else{const bn=both(f);b=bn.length?bn.reduce((x,k)=>x+kval(p,k,f),0):null;if(cur)b=null}
    const note=(cur&&f!=='abonnes'&&a!=null)?'<span class="d">Semaine en cours</span>':'';
    return `<div class="kpi"><div class="eyebrow">${l}${cur?'':' · sem. dernière'}</div><div class="v">${nf(a)}</div>${a==null?'<span class="d">En attente de la récupération automatique</span>':(note||delta(a,b))}`+
      (nets.length>1?`<div class="split">${nets.map(k=>`<span><i class="dot ${k}"></i> ${nf(f==='abonnes'?subs(w,k):kval(w,k,f))}</span>`).join('')}</div>`:'')+`</div>`}).join('')+`</div>`;
}

function calendarCard(){
  const y=cal.getFullYear(),mo=cal.getMonth();const start=monday(new Date(y,mo,1));const last=new Date(y,mo+1,0);
  const end=new Date(last);end.setDate(end.getDate()+((7-((last.getDay()+6)%7)-1)));
  const byDay={};sortPosts(S.posts.filter(inNF)).forEach(p=>{if(p.date)(byDay[p.date]=byDay[p.date]||[]).push(p)});
  const chip=p=>`<button class="chip st-${p.status}" draggable="${p.status!=='publie'}" data-a="open" data-id="${p.id}" title="${esc(STL[p.status])} · ${esc(p.title)}">${dots(p.networks)}<span class="hr">${esc(p.time||'')}</span><span class="t">${esc(p.title||'Sans titre')}</span></button>`;
  let cells='';for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const s=ymd(d);
    cells+=`<div class="day ${d.getMonth()!==mo?'out':''} ${s===today()?'today':''}" data-day="${s}"><div class="num"><b>${d.getDate()}</b><button class="add" data-a="new" data-date="${s}" aria-label="Ajouter un post le ${d.getDate()}">+</button></div>${(byDay[s]||[]).map(chip).join('')}</div>`}
  const agendaDays=Object.keys(byDay).filter(s=>{const d=parse(s);return d.getMonth()===mo&&d.getFullYear()===y}).sort();
  return `<section class="card"><div class="sechead"><h2>Mois</h2><div class="calnav"><button class="btn sm ghost" data-a="cal" data-d="-1" aria-label="Mois précédent">‹</button><b>${cal.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</b><button class="btn sm ghost" data-a="cal" data-d="1" aria-label="Mois suivant">›</button><button class="btn sm ghost" data-a="cal" data-d="0">Aujourd’hui</button></div></div>
  <div class="cal">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(h=>`<div class="h">${h}</div>`).join('')}${cells}</div>
  <div class="agenda">${agendaDays.length?agendaDays.map(s=>`<div><h3>${fmtDay(s)}</h3><div class="list">${byDay[s].map(chip).join('')}</div></div>`).join(''):'<p class="empty">Aucun post prévu ce mois-ci.</p>'}</div>
  <div class="legend" style="margin-top:12px">${NETS.map(n=>`<span><i class="dot ${n.k}"></i>${n.name}</span>`).join('')}</div></section>`;
}

  return `<section class="card"><div class="sechead"><h2>Statistiques</h2><small>Vues par semaine, 8 dernières</small></div>${auto}
   <div class="bars" aria-hidden="true">${vues.map((v,i)=>`<i class="${i===7?'cur':''}" style="height:${Math.max(3,v/mx*100)}%"><span>${Number(weeks[i].slice(6))}</span></i>`).join('')}</div>
   <div class="tbl" style="margin-top:22px"><table><thead><tr><th>Semaine</th><th>Abonnés</th><th>Vues</th><th>Interact.</th><th>Messages</th></tr></thead><tbody>${rows.length?rows.map(w=>`<tr><td>S${Number(w.slice(6))}</td>${['abonnes','vues','interactions','messages'].map(f=>`<td>${nf(kval(w,k,f))}</td>`).join('')}</tr>`).join(''):'<tr><td colspan="5" class="hint" style="text-align:left">Aucune semaine saisie.</td></tr>'}</tbody></table></div>
   <form data-f="kpi" data-net="${k}" style="display:grid;gap:8px;margin-top:16px"><label class="f">Saisir les chiffres de<select id="k-week-${k}">${opts}</select></label>

     <div><button class="btn" type="submit">Enregistrer la semaine</button> <span class="hint">Pour compléter ou corriger à la main (les messages, par exemple). Les chiffres automatiques remplacent la saisie à chaque mise à jour.</span></div></form>
   ${top.length?`<h3 class="eyebrow" style="margin:18px 0 6px">Meilleurs posts</h3><div class="list">${top.map(p=>`<div class="row"><button class="linkish ttl" data-a="open" data-id="${p.id}">${esc(p.title)}</button><span class="count">${nf(p.stats[k].vues)} vues</span></div>`).join('')}</div>`:''}</section>`;
}

function weekCard(){
  const m=monday(new Date());m.setDate(m.getDate()+7*wk);
  const days=[...Array(7)].map((_,i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return d});
  const byDay={};sortPosts(S.posts.filter(inNF)).forEach(p=>{if(p.date)(byDay[p.date]=byDay[p.date]||[]).push(p)});
  const card=p=>`<button class="wpost" draggable="${p.status!=='publie'}" data-a="open" data-id="${p.id}" style="--c:var(--${(p.networks||[])[0]||'muted'})"><b>${esc(p.title||'Sans titre')}</b><span>${p.time?esc(p.time)+' · ':''}${dots(p.networks)}</span>${pill(p.status)}</button>`;
  return `<div class="week">${days.map(d=>{const s=ymd(d),isT=s===today();return `<div class="wday ${isT?'today':''}" data-day="${s}"><div class="wh"><span>${d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})}</span>${isT?'<em>Aujourd’hui</em>':''}</div>${(byDay[s]||[]).map(card).join('')}<button class="wadd" data-a="new" data-date="${s}" ${NF!=='all'?`data-net="${NF}"`:''}>+ Ajouter</button></div>`}).join('')}</div>`;
}

function mediaItems(){
  const map=new Map();
  S.studio.forEach(j=>(j.images||[]).forEach(im=>{if(!map.has(im.path))map.set(im.path,{path:im.path,name:j.product_title,src:'studio',at:j.created_at,used:0})}));
  S.posts.forEach(p=>(p.visuals||[]).forEach(v=>{if(!v.path)return;const e=map.get(v.path)||{path:v.path,name:v.name||p.title,src:v.path.startsWith('studio/')?'studio':'import',at:p.created_at,used:0};e.used++;map.set(v.path,e)}));
  return [...map.values()].sort((a,b)=>(b.at||'').localeCompare(a.at||''));
}

  return `<div class="stban"><b>Pas encore programmé</b><span>Remplissez les 4 étapes, puis cliquez sur <b>Programmer</b> en bas.</span></div>`;
}

function playPreview(btn){
  const src=btn.dataset.src;
  if(player&&player.dataset.src===src&&!player.paused){player.pause();btn.textContent='▶';return}

/* Reel diaporama : les photos deviennent une vidéo verticale (2,5 s par photo) pour porter la musique Instagram. */
async function makeSlideshow(d,fit){
  const W=1080,H=1920,per=2.5,fade=.35,fps=30;
  const imgs=[];for(const v of d.visuals){const b=await renderVis(v,'ig',fit||'cover',[W,H]);imgs.push(await createImageBitmap(b))}
  const types=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4'];
  const mime=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  if(!mime)throw new Error('Ce navigateur ne sait pas créer de vidéo MP4 : utilisez Chrome à jour.');
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const ac=new AudioContext(),osc=ac.createOscillator(),g=ac.createGain(),dst=ac.createMediaStreamDestination();g.gain.value=0;osc.connect(g).connect(dst);osc.start();
  const stream=new MediaStream([...c.captureStream(fps).getVideoTracks(),...dst.stream.getAudioTracks()]);
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8e6});const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const total=Math.max(imgs.length*per,5);
  const draw=t=>{const i=Math.min(Math.floor(t/per),imgs.length-1),lt=t-i*per,z=1+.06*(lt/per);
    const one=(img,a,zz)=>{x.globalAlpha=a;const w=W*zz,h=H*zz;x.drawImage(img,(W-w)/2,(H-h)/2,w,h)};
    x.globalAlpha=1;x.fillStyle='#000';x.fillRect(0,0,W,H);one(imgs[i%imgs.length],1,z);
    if(i<imgs.length-1&&lt>per-fade)one(imgs[i+1],(lt-(per-fade))/fade,1);x.globalAlpha=1};
  draw(0);rec.start(250);const t0=performance.now();
  await new Promise(res=>{const tick=()=>{const t=(performance.now()-t0)/1000;if(t>=total){res();return}draw(t);setTimeout(tick,1000/fps)};tick()});
  await new Promise(res=>{rec.onstop=res;rec.stop()});osc.stop();ac.close();stream.getTracks().forEach(t=>t.stop());
  return new Blob(chunks,{type:'video/mp4'});
}

function pubState(p,k){
  if(!p.id||!['valide','programme','publie'].includes(p.status))return '';
  const s=p.published?.[k]||{},auto=isAuto(p,k),conn=S.connections.find(c=>c.net===k);
  if(s.done&&s.draft)return `<div class="pubst wait" style="display:block"><b>Brouillon TikTok à finaliser</b> (envoyé le ${fmtDate(s.at)}).<br>Dans l’appli TikTok : <b>Boîte de réception → Notifications système</b> → touchez le message, ajoutez le son${p.product?' et le produit':''}, puis publiez. <button class="btn sm primary" data-a="pubmanual" data-k="${k}" style="margin-left:4px">C’est publié</button></div>`;
  if(s.done)return `<div class="pubst ok">Publié ${s.manual?'(à la main) ':''}le ${fmtDate(s.at)}${s.url?` · <a href="${esc(s.url)}" target="_blank" rel="noopener">voir le post</a>`:''}</div>`;
  if(s.error)return `<div class="pubst err">Échec : ${esc(s.error)} <button class="btn sm" data-a="pubretry" data-k="${k}">Réessayer</button><button class="btn sm ghost" data-a="pubmanual" data-k="${k}">Marquer publié</button></div>`;
  if(s.stage)return `<div class="pubst wait">${s.stage==='postfast'?'Envoyé à PostFast, publication en cours…':s.stage==='music'?'Instagram prépare le Reel avec la musique…':'Envoi en cours (Instagram prépare le média)…'}</div>`;
  if(k==='ig'&&p.music?.ig&&!S.connections.find(c=>c.net==='igm'))return `<div class="pubst err">Musique Instagram non connectée : voir « Réseaux connectés », ou retirez la musique.</div>`;
  if(auto&&!conn)return `<div class="pubst err">${NET[k].name} n’est pas connecté : voir « Réseaux connectés » dans l’onglet Tout. <button class="btn sm ghost" data-a="pubmanual" data-k="${k}">Marquer publié</button></div>`;
  if(auto)return `<div class="pubst wait">${k==='tt'&&sendMode(p,k)==='brouillon'?'Brouillon TikTok envoyé':'Publication automatique'} ${p.status==='programme'?`le ${fmtDay(p.date)} à ${esc(p.time||'00:00')}`:'une fois le post programmé'}</div>`;
  return `<div class="pubst">À publier à la main${k==='tt'&&p.send?.tt==='brouillon'?' (brouillon TikTok)':''}. <button class="btn sm" data-a="pubmanual" data-k="${k}">Marquer publié</button></div>`;
}
function visualsSection(p){

  const thumbs=V.map((v,i)=>`<div class="vthumb">${media(v)}<span class="ix">${i+1}</span>${isVid(v)?'<span class="vid">vidéo</span>':''}<div class="vb"><button data-a="vmove" data-i="${i}" data-d="-1" aria-label="Avancer le visuel ${i+1}">‹</button><button data-a="vdel" data-i="${i}" aria-label="Retirer le visuel ${i+1}">×</button><button data-a="vmove" data-i="${i}" data-d="1" aria-label="Reculer le visuel ${i+1}">›</button></div></div>`).join('');

function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=url})}
async function renderVis(v,k,fit,size){
  const [W,H]=size||SIZES[k],img=await loadImg(vurl(v)),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const box=m=>{const r=m==='cover'?Math.max(W/img.width,H/img.height):Math.min(W/img.width,H/img.height),w=img.width*r,h=img.height*r;return [(W-w)/2,(H-h)/2,w,h]};
  x.fillStyle='#111';x.fillRect(0,0,W,H);
  if(fit==='contain'){if('filter' in x){const [a,b,w,h]=box('cover');x.filter='blur(40px) brightness(0.8)';x.drawImage(img,a-60,b-60,w+120,h+120);x.filter='none'}x.drawImage(img,...box('contain'))}
  else x.drawImage(img,...box('cover'));
  return new Promise((r,j)=>c.toBlob(b=>b?r(b):j(new Error('canvas')),'image/jpeg',0.92));
}
const slug=s=>(s||'post').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'post';

    const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=file;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('Visuels téléchargés');

async function uploadFiles(files){

async function savePost(){
  readEditor();if(!draft.title){toast('Donnez un titre au post');$('#e-title').focus();return}
  if(!draft.networks.length){toast('Cochez au moins un réseau');return}
  await guard(async()=>{
    const live=draft.id?S.posts.find(x=>x.id===draft.id):null;
    const d=draft;
    if(d.status==='programme'){
      if(Object.keys((live||d).validations||{}).length<(d.simple?1:2)){toast('Faites d’abord valider le post avant de le programmer');return}
      if(!d.date){toast('Choisissez une date de publication');return}
      const bad=d.networks.map(k=>fmtProblem(d,k)).find(Boolean);if(bad){toast(bad);return}
    }
    if(!d.id)d.id=crypto.randomUUID();
    let rendered=(live&&live.rendered)||{};
    if(d.status==='programme'&&d.visuals?.length){toast('Préparation des images pour chaque réseau…');rendered=await renderAll(d)}
    const data={title:d.title,networks:d.networks,format:d.format,date:d.date||null,time:d.time||'',status:d.status,simple:!!d.simple,captions:d.captions||{},notes:d.notes||'',validations:(live||d).validations||{},stats:d.stats||{},send:d.send||{},fit:d.fit||{},visuals:d.visuals||[],rendered,pin_board:d.pin_board||null,music:d.music||null,formats:Object.fromEntries(d.networks.map(k=>[k,fmtOf(d,k)])),updated_at:nowIso()};
    if(data.status==='a_valider'&&Object.keys(data.validations).length>=(data.simple?1:2))data.status='valide';
    if(live)ok(await T('posts').update(data).eq('id',d.id));else{data.id=d.id;data.created_by=me.id;ok(await T('posts').insert(data))}
    if(d.fromIdea)await T('ideas').delete().eq('id',d.fromIdea);
    await loadTable('posts');await loadTable('ideas');
    toast('Post enregistré');closeEditor();
  });
}
async function renderAll(d){
  const out={};let slide=null;
  for(const k of d.networks){
    out[k]=[];
    const size=sizeFor(d,k),fit=d.fit?.[k]||'cover';
    if(needsVideo(d,k)&&photosOnly(d)){
      if(!slide){toast('Création de la vidéo diaporama… gardez cet onglet ouvert');const blob=await makeSlideshow(d,fit);slide=`rendered/${d.id}/video-${Date.now()}.mp4`;ok(await sb.storage.from(BUCKET).upload(slide,blob,{contentType:'video/mp4',upsert:true,cacheControl:'60'}))}
      out[k].push(slide);continue;
    }
    for(let i=0;i<d.visuals.length;i++){
      const v=d.visuals[i];
      if(isVid(v)){out[k].push(v.path);continue}
      const blob=await renderVis(v,k,fit,size),path=`rendered/${d.id}/${k}/${pad(i+1)}.jpg`;
      ok(await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:true,cacheControl:'60'}));
      out[k].push(path);
    }
  }
  return out;
}

  if(t==='msg'){const x=v('m-text-'+k).value.trim();if(!x){toast('Collez le message reçu');return}const net=k||v('m-net').value;await guard(async()=>{ok(await T('messages').insert({net,from_handle:v('m-from-'+k).value.trim(),type:v('m-type-'+k).value,text:x,by_email:me.id}));await loadTable('messages');v('m-text-'+k).value='';v('m-from-'+k).value='';toast('Message ajouté')})}
  if(t==='kpi'){const w=v('k-week-'+k).value;const vals={};['abonnes','vues','interactions','messages'].forEach(x=>{const i=v(`k-${x}-${k}`).value;if(i!=='')vals[x]=Number(i)});if(!Object.keys(vals).length){toast('Saisissez au moins un chiffre');return}
    await guard(async()=>{ok(await T('kpis').upsert({week:w,net:k,...vals,updated_at:nowIso()},{onConflict:'week,net'}));await loadTable('kpis');['abonnes','vues','interactions','messages'].forEach(x=>v(`k-${x}-${k}`).value='');toast('Chiffres enregistrés')})}
  if(t==='member'){const em=v('mb-email').value.trim().toLowerCase(),nm=v('mb-name').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast('E-mail invalide');return}
    await guard(async()=>{ok(await T('members').upsert({email:em,name:nm},{onConflict:'email'}));v('mb-email').value='';v('mb-name').value='';await loadTable('members');toast('Accès donné à '+em)})}
  if(t==='myname'){const nm=v('my-name').value.trim();await guard(async()=>{ok(await T('members').update({name:nm}).eq('email',me.id));await loadTable('members');toast('Prénom enregistré')})}
  if(t==='login')await doLogin(f.dataset.mode);
  if(t==='connect'){const tok=v('cn-'+k).value.trim();if(!tok){toast('Collez le jeton');return}const btn=f.querySelector('button');btn.disabled=true;btn.textContent='Vérification…';
    try{const body={net:k,token:tok};if(k==='fb'&&v('cn-page'))body.page_id=v('cn-page').value;
      const r=await sb.functions.invoke('hub-connect',{body});
      if(r.error){let msg=r.error.message;try{msg=(await r.error.context.json()).error||msg}catch(_){}toast(msg);return}
      if(r.data?.choose){S.fbPages=r.data.choose;render(true);const i=document.getElementById('cn-fb');if(i)i.value=tok;toast('Choisissez la Page, puis cliquez à nouveau sur Connecter');return}
      S.fbPages=null;v('cn-'+k).value='';await loadTable('connections');toast(`${NET[k].name} connecté : ${r.data.account}`)}
    finally{btn.disabled=false;btn.textContent='Connecter'}}
  if(t==='igm'){const tok=v('cn-igm').value.trim();if(!tok){toast('Collez le jeton');return}const btn=f.querySelector('button');btn.disabled=true;btn.textContent='Vérification…';
    try{const r=await sb.functions.invoke('hub-music',{body:{action:'ig_connect',token:tok}});
      if(r.error){let msg=r.error.message;try{msg=(await r.error.context.json()).error||msg}catch(_){}toast(msg);return}
      v('cn-igm').value='';await loadTable('connections');toast(r.data.music?`Musique Instagram connectée : ${r.data.account}`:`Connecté (${r.data.account}), mais la bibliothèque musicale ne répond pas encore`)}
    finally{btn.disabled=false;btn.textContent='Connecter'}}
  if(t==='store'){const x=v('store-text').value.trim();await guard(async()=>{ok(await T('settings').upsert({key:'store_info',value:{text:x},updated_at:nowIso()},{onConflict:'key'}));await loadTable('settings');toast('Infos boutique enregistrées')})}
  if(t==='newpass'){const pw=v('np-pass').value;if(pw.length<8){toast('8 caractères minimum');return}const r=await sb.auth.updateUser({password:pw});if(r.error){toast('Échec : '+r.error.message);return}toast('Mot de passe enregistré');recovery=false;start()}
});
document.addEventListener('focusout',e=>{const id=e.target.dataset?.reply;if(!id||!sb||S.status!=='ready')return;const m=S.messages.find(x=>x.id===id);if(m&&(m.reply||'')!==e.target.value){m.reply=e.target.value;T('messages').update({reply:e.target.value}).eq('id',id).then(r=>{if(r.error)toast('Réponse non enregistrée')})}});

/* ---------- auth ---------- */
function authView(){
  if(S.status==='loading')return '<div class="login"><p class="hint">Chargement…</p></div>';
  if(S.status==='denied')return `<div class="login"><div class="eyebrow">Hub Select</div><h1>Accès non autorisé</h1><p>Le compte <b>${esc(me.id)}</b> n’est pas dans l’équipe du hub. Demandez à un membre de vous ajouter dans l’encadré Équipe, puis rechargez la page.</p><div><button class="btn" data-a="signout">Changer de compte</button></div></div>`;
  if(S.status==='recovery')return `<div class="login"><div class="eyebrow">Hub Select</div><h1>Nouveau mot de passe</h1><form data-f="newpass"><label class="f">Mot de passe (8 caractères minimum)<input type="password" id="np-pass" autocomplete="new-password" required minlength="8"></label><button class="btn primary" type="submit">Enregistrer</button></form></div>`;
  const signup=S.authMode==='signup';
  return `<div class="login"><div class="eyebrow">Select · Vichy</div><h1>Hub réseaux</h1>
   <p class="hint" style="margin:0">${signup?'Première connexion : créez votre mot de passe. Votre e-mail doit avoir été ajouté à l’équipe.':'Connectez-vous avec l’e-mail ajouté à l’équipe du hub.'}</p>
   <form data-f="login" data-mode="${signup?'signup':'signin'}"><label class="f">E-mail<input type="email" id="lg-email" autocomplete="email" required></label>
   <label class="f">Mot de passe${signup?' (8 caractères minimum)':''}<input type="password" id="lg-pass" autocomplete="${signup?'new-password':'current-password'}" required ${signup?'minlength="8"':''}></label>
   <button class="btn primary" type="submit">${signup?'Créer mon accès':'Se connecter'}</button></form>
   <div style="display:flex;gap:14px;flex-wrap:wrap"><button class="linkish hint" data-a="authmode">${signup?'J’ai déjà un mot de passe':'Première connexion ? Créer mon mot de passe'}</button>${signup?'':'<button class="linkish hint" data-a="forgot">Mot de passe oublié</button>'}</div></div>`;
}
document.addEventListener('click',e=>{if(e.target.closest('[data-a="authmode"]')){S.authMode=S.authMode==='signup'?'signin':'signup';render(true)}});
async function doLogin(mode){
  const em=$('#lg-email').value.trim().toLowerCase(),pw=$('#lg-pass').value;
  if(mode==='signup'){const r=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
    if(r.error){toast(r.error.message.includes('registered')?'Ce compte existe déjà : connectez-vous':'Création impossible : '+r.error.message);return}
    if(!r.data.session){toast('Compte créé. Ouvrez l’e-mail de confirmation, puis connectez-vous ici.');S.authMode='signin';render(true);return}}
  else{const r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error){toast(r.error.message.includes('confirm')?'Confirmez d’abord votre e-mail (lien reçu par e-mail)':'E-mail ou mot de passe incorrect');return}}
  start();
}

/* ---------- data ---------- */
const TABLES={posts:['posts','created_at'],ideas:['ideas','created_at'],messages:['messages','created_at'],kpis:['kpis','week'],recaps:['recaps','week'],members:['members','added_at'],connections:['connections','net'],settings:['settings','key'],studio:['studio','created_at'],prompts:['prompts','position']};
async function loadTable(n){
  const r=await T(TABLES[n][0]).select('*').order(TABLES[n][1]);if(r.error)throw r.error;
  if(n==='kpis'){const o={};r.data.forEach(x=>{(o[x.week]=o[x.week]||{week:x.week})[x.net]={abonnes:x.abonnes,vues:x.vues,interactions:x.interactions,messages:x.messages}});S.kpis=o}
  else S[n]=r.data;
  if(n==='studio')studioPoll();
  if(n==='posts'&&draft?.id){const l=S.posts.find(x=>x.id===draft.id);if(l&&(JSON.stringify(l.validations||{})!==JSON.stringify(draft.validations||{})||JSON.stringify(l.published||{})!==JSON.stringify(draft.published||{}))){readEditor();draft.validations=l.validations||{};draft.published=l.published||{};draft.status=l.status;renderEditor()}}
  render();
}
let channel=null,started=false;
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(recovery){S.status='recovery';render(true);return}
  if(!session){S.status='login';render(true);return}
  me={id:(session.user.email||'').toLowerCase(),name:''};
  const m=await T('members').select('email').eq('email',me.id).maybeSingle();
  if(m.error){S.status='offline';render(true);return}
  if(!m.data){S.status='denied';render(true);return}
  try{await Promise.all(Object.keys(TABLES).map(loadTable));S.status='ready'}catch(e){console.warn(e);S.status='offline'}
  sb.functions.invoke('hub-postfast',{body:{action:'status'}}).then(r=>{S.pfKey=!!r.data?.key;render()}).catch(()=>{});
  studioStatus();
  render(true);
  if(!channel){channel=sb.channel('hub-select');Object.keys(TABLES).forEach(n=>channel.on('postgres_changes',{event:'*',schema:'public',table:'hub_'+TABLES[n][0]},()=>loadTable(n).catch(()=>{})));channel.subscribe()}
}
function boot(){
  if(!window.supabase||!window.HUB_CONFIG){S.status='offline';render(true);return}
  sb=supabase.createClient(HUB_CONFIG.url,HUB_CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){recovery=true;S.status='recovery';render(true)}});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.status==='ready')Object.keys(TABLES).forEach(n=>loadTable(n).catch(()=>{}))});
  start();
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(S.status==='ready')renderTabs()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script>
